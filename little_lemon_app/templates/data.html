<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <table>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Price_after_task</th>
        </tr>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.catagory.title }}</td>
            <td>{{ item.price }}</td>
            <td>{{ item.stock }} </td>
            <td>{{ item.price_after_task }} </td>
        </tr>
        {% empty %}
        <tr>
            <td></td>
            <td>Empty</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
